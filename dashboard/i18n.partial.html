    const DICTS = { fr: null, en: EN };
    const LOCALES = { fr: "fr-FR", en: "en-GB" };

    // ── Compiled matcher (longest phrase wins) ──────────────────────
    const rxCache = {};
    function matcher(lang) {
        if (rxCache[lang] !== undefined) return rxCache[lang];
        const dict = DICTS[lang];
        if (!dict) return (rxCache[lang] = null);
        const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const src = Object.keys(dict)
            .sort((a, b) => b.length - a.length)
            .map(k => {
                let p = esc(k);
                if (/^[\p{L}\p{N}]/u.test(k)) p = "(?<![\\p{L}\\p{N}])" + p;
                if (/[\p{L}\p{N}]$/u.test(k)) p = p + "(?![\\p{L}\\p{N}])";
                return p;
            })
            .join("|");
        let rx = null;
        try { rx = new RegExp(src, "gu"); } catch (e) { /* no lookbehind support */ }
        return (rxCache[lang] = rx);
    }

    function translateString(s, lang) {
        const dict = DICTS[lang];
        if (!dict || !s) return s;
        if (dict[s] !== undefined) return dict[s];
        const rx = matcher(lang);
        if (!rx) return s;
        rx.lastIndex = 0;
        return s.replace(rx, m => (dict[m] !== undefined ? dict[m] : m));
    }

    // ── DOM walking ─────────────────────────────────────────────────
    const origText = new WeakMap();   // Text node -> original French value
    const origAttr = new WeakMap();   // Element   -> { attr: original value }

    function applyToText(node, lang) {
        let src = origText.get(node);
        if (src === undefined) { src = node.nodeValue; origText.set(node, src); }
        const out = lang === DEFAULT_LANG ? src : translateString(src, lang);
        if (node.nodeValue !== out) node.nodeValue = out;
    }

    function applyToAttrs(el, lang) {
        let store = origAttr.get(el);
        for (const a of ATTRS) {
            if (!el.hasAttribute(a)) continue;
            if (!store) { store = {}; origAttr.set(el, store); }
            if (store[a] === undefined) store[a] = el.getAttribute(a);
            const out = lang === DEFAULT_LANG ? store[a] : translateString(store[a], lang);
            if (el.getAttribute(a) !== out) el.setAttribute(a, out);
        }
    }

    function translateTree(root, lang) {
        if (!root) return;
        if (root.nodeType === Node.TEXT_NODE) {
            const p = root.parentElement;
            if (!p || !SKIP_TAGS.has(p.tagName)) applyToText(root, lang);
            return;
        }
        if (root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_NODE) return;
        if (root.tagName && SKIP_TAGS.has(root.tagName)) return;
        if (root.nodeType === Node.ELEMENT_NODE) applyToAttrs(root, lang);

        const walker = document.createTreeWalker(
            root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
                acceptNode(n) {
                    if (n.nodeType === Node.ELEMENT_NODE) {
                        return SKIP_TAGS.has(n.tagName)
                            ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
                    }
                    return n.nodeValue && n.nodeValue.trim()
                        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                }
            });
        let n;
        while ((n = walker.nextNode())) {
            if (n.nodeType === Node.TEXT_NODE) applyToText(n, lang);
            else applyToAttrs(n, lang);
        }
    }

    // ── Public API ──────────────────────────────────────────────────
    const I18N = {
        lang: DEFAULT_LANG,
        get locale() { return LOCALES[I18N.lang] || LOCALES[DEFAULT_LANG]; },
        t(s) { return I18N.lang === DEFAULT_LANG ? s : translateString(s, I18N.lang); },
        setLang(lang, persist) {
            if (!Object.prototype.hasOwnProperty.call(DICTS, lang)) lang = DEFAULT_LANG;
            I18N.lang = lang;
            document.documentElement.lang = lang;
            if (persist !== false) {
                try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) { /* private mode */ }
            }
            translateTree(document.documentElement, lang);
            document.querySelectorAll(".lang-switcher button").forEach(b => {
                b.classList.toggle("active", b.dataset.lang === lang);
            });
            document.dispatchEvent(new CustomEvent("i18n:changed", { detail: { lang: lang } }));
        },
        refresh() { translateTree(document.documentElement, I18N.lang); }
    };
    window.I18N = I18N;
    window.t = I18N.t;

    // Initial language: ?lang= query param > localStorage > French (default)
    let initial = DEFAULT_LANG;
    try {
        const q = new URLSearchParams(location.search).get("lang");
        const stored = localStorage.getItem(STORAGE_KEY);
        initial = (q || stored || DEFAULT_LANG).toLowerCase().slice(0, 2);
    } catch (e) { /* ignore */ }
    if (!Object.prototype.hasOwnProperty.call(DICTS, initial)) initial = DEFAULT_LANG;
    I18N.lang = initial;
    document.documentElement.lang = initial;

    // Translate every node injected later on (dynamic rendering)
    new MutationObserver(muts => {
        if (I18N.lang === DEFAULT_LANG) return;
        for (const m of muts) {
            for (const node of m.addedNodes) translateTree(node, I18N.lang);
        }
    }).observe(document.documentElement, { childList: true, subtree: true });

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".lang-switcher button").forEach(b => {
